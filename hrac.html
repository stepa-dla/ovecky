<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pastýř · Ovečky do Betléma</title>
<meta name="theme-color" content="#1d2f5b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;1,400&display=swap">
<style>
/* Ovladač pastýře. Celý displej je kus modrotiskového plátna a zároveň ovládací plocha:
   kamkoli položíš prst, tam se objeví věneček pastýře (jako na obrazovce) a táhnutím ho vedeš.
   Text jen tam, kde je potřeba: kdo jsem, kolik zbývá, co teď. */
:root {
  --cloth: #1d2f5b; --deep: #132140; --linen: #ecebe5; --dim: #aab3c9; --me: #ecebe5;
  --pad-x: max(34px, env(safe-area-inset-left)); --pad-r: max(34px, env(safe-area-inset-right));
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body { background: var(--cloth); color: var(--linen); font: 400 19px/1.45 'Alegreya', Georgia, serif; overflow: hidden;
  overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
#pad { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.top { position: fixed; left: 0; right: 0; top: 0; padding: max(30px, env(safe-area-inset-top)) var(--pad-r) 0 var(--pad-x);
  display: grid; grid-template-columns: 1fr auto auto; align-items: center; column-gap: 8px; pointer-events: none; }
.top h1 { margin: 0; font: italic 400 31px/1.15 'Alegreya', Georgia, serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
body:not(.me) .top h1::before { display: none; }
.top h1::before { content: ''; display: inline-block; width: 0.42em; height: 0.42em; margin-right: 0.32em; border-radius: 50%; background: var(--me); vertical-align: 0.12em; }
.time { font: 500 31px/1 'Alegreya', Georgia, serif; font-variant-numeric: tabular-nums lining-nums; }
.time:empty { display: none; }
.snd { pointer-events: auto; width: 44px; height: 44px; margin-right: -10px; padding: 0; display: grid; place-items: center; background: none; border: 0; color: var(--linen); }
.snd svg { width: 26px; height: 26px; }
.snd .off { display: none; }
.snd[aria-pressed="false"] .on { display: none; }
.snd[aria-pressed="false"] .off { display: inline; }
.snd:focus-visible, .ready:focus-visible { outline: 2px solid var(--linen); outline-offset: 3px; }
.line { grid-column: 1 / -1; margin: 6px 0 0; max-width: 30ch; color: var(--dim); text-wrap: pretty; }
.line:empty { display: none; }
.foot { position: fixed; left: 0; right: 0; bottom: 0; padding: 0 var(--pad-r) max(18px, env(safe-area-inset-bottom)) var(--pad-x);
  display: grid; gap: 14px; pointer-events: none; padding-bottom: max(34px, env(safe-area-inset-bottom)); }
.note { margin: 0; color: var(--dim); text-wrap: pretty; }
.note:empty { display: none; }
.ready { pointer-events: auto; min-height: 64px; width: 100%; font: 500 23px/1 'Alegreya', Georgia, serif; color: var(--deep); background: var(--linen);
  border: 0; border-radius: 4px; }
.ready[aria-pressed="true"] { color: var(--linen); background: transparent; box-shadow: inset 0 0 0 2px var(--linen); }
.ready[hidden] { display: none; }
@media (orientation: landscape) and (max-height: 520px) {
  .foot { left: auto; width: min(46vw, 360px); }
}
</style>
</head>
<body>
<canvas id="pad" aria-label="Ovládací plocha: polož prst a táhni směrem, kam má pastýř jít"></canvas>
<header class="top">
  <h1 id="name">Ovečky do Betléma</h1>
  <span class="time" id="time"></span>
  <button class="snd" id="snd" type="button" aria-pressed="true" aria-label="Zvuk">
    <svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 10h4l5-4.5v15L8 16H4z" fill="currentColor" stroke="none"/>
      <path class="on" d="M17 9.5c1.3 1 1.3 6 0 7M20 6.5c3 2.5 3 10.5 0 13"/>
      <path class="off" d="M17.5 10l5 6M22.5 10l-5 6"/>
    </svg>
  </button>
  <p class="line" id="line" aria-live="polite"></p>
</header>
<footer class="foot">
  <p class="note" id="note" aria-live="polite"></p>
  <button class="ready" id="ready" type="button" aria-pressed="false" hidden>Jsem připraven</button>
</footer>

}
function lem(c, w, h) {                                             // lem z puntíků a kosočtverečků jako okraj desky na obrazovce
  const b = 16, dot = (x, y, r) => { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill(); };
  const dia = (x, y, r) => { c.beginPath(); c.moveTo(x, y - r); c.lineTo(x + r * 0.62, y); c.lineTo(x, y + r); c.lineTo(x - r * 0.62, y); c.closePath(); c.fill(); };
  c.fillStyle = '#15244a'; c.fillRect(0, 0, w, b); c.fillRect(0, h - b, w, b); c.fillRect(0, 0, b, h); c.fillRect(w - b, 0, b, h);
  c.strokeStyle = '#ecebe5'; c.lineWidth = 1.4; c.strokeRect(b + 3.5, b + 3.5, w - 2 * b - 7, h - 2 * b - 7);
  c.fillStyle = '#ecebe5';
  const run = (x0, y0, x1, y1) => { const n = Math.max(2, Math.round(Math.hypot(x1 - x0, y1 - y0) / 18)); for (let k = 0; k <= n; k++) { const x = x0 + (x1 - x0) * k / n, y = y0 + (y1 - y0) * k / n; if (k % 2) dia(x, y, 4.6); else dot(x, y, 1.7); } };
  run(34, b / 2, w - 34, b / 2); run(34, h - b / 2, w - 34, h - b / 2); run(b / 2, 34, b / 2, h - 34); run(w - b / 2, 34, w - b / 2, h - 34);
  for (const [x, y] of [[b / 2, b / 2], [w - b / 2, b / 2], [w - b / 2, h - b / 2], [b / 2, h - b / 2]]) { dia(x, y, 7); c.fillStyle = '#15244a'; dot(x, y, 1.7); c.fillStyle = '#ecebe5'; }
}
function layout() {                                                  // volné místo mezi textem nahoře a tlačítkem dole
  const t = document.querySelector('.top').getBoundingClientRect(), f = document.querySelector('.foot').getBoundingClientRect();
  const land = V.w > V.h && V.h < 520;
  V.top = t.bottom; V.bot = land ? V.h : f.top;
  V.cx = land ? (V.w - Math.min(V.w * 0.46, 360)) / 2 : V.w / 2;
  V.cy = (V.top + V.bot) / 2;
  V.R = Math.max(46, Math.min(96, Math.min(land ? V.w * 0.5 : V.w, V.bot - V.top) * 0.24));
}
let raf = 0, lastT = 0;
function draw() { if (!raf) raf = requestAnimationFrame(frame); }
function frame(ts) {
  raf = 0;
  const dt = lastT ? Math.min(0.1, (ts - lastT) / 1000) : 0; lastT = ts;
  const k = Math.hypot(J.x, J.y);
  if (J.on && k > 0.1) { J.dir = Math.atan2(J.y, J.x); J.rot += dt * (0.6 + k * 1.6); }   // věneček se při chůzi pomalu točí
  g.setTransform(1, 0, 0, 1, 0, 0); g.drawImage(cloth, 0, 0);
  g.setTransform(V.dpr, 0, 0, V.dpr, 0, 0);
  const R = V.R, cx = J.on ? J.ox : V.cx, cy = J.on ? J.oy : V.cy, live = ME.live, s = R / 60;
  g.globalAlpha = live ? 1 : 0.32;
  g.fillStyle = '#ecebe5';
  for (let q = 0; q < 12; q++) { const a = J.rot + q / 12 * Math.PI * 2; g.beginPath(); g.arc(cx + Math.cos(a) * R, cy + Math.sin(a) * R, 2.6 * s * (q % 2 ? 0.85 : 1.15), 0, Math.PI * 2); g.fill(); }
  if (live) {                                                          // oblouček v barvě pastýře: kam jde
    g.strokeStyle = ME.col; g.lineWidth = 6 * s; g.lineCap = 'round';
    g.beginPath(); g.arc(cx, cy, R + 12 * s, J.dir - 0.5, J.dir + 0.5); g.stroke();
  }
  const kx = cx + J.x * R * 0.82, ky = cy + J.y * R * 0.82;          // palec: modrotiskový kvítek (osm lístků, vyrytý střed)
  g.globalAlpha = live ? 1 : 0.28;
  flower(kx, ky, R * 0.3, J.rot * 0.5);
  g.globalAlpha = 1;
  if (J.on) draw();
}
function flower(x, y, r, rot) {
  g.fillStyle = '#ecebe5';
  for (let k = 0; k < 8; k++) { const a = rot + k / 8 * Math.PI * 2; g.beginPath(); g.arc(x + Math.cos(a) * r * 0.62, y + Math.sin(a) * r * 0.62, r * 0.38, 0, Math.PI * 2); g.fill(); }
  g.beginPath(); g.arc(x, y, r * 0.62, 0, Math.PI * 2); g.fill();
  g.strokeStyle = '#1d2f5b'; g.lineWidth = Math.max(1.2, r * 0.07);
  g.beginPath(); g.arc(x, y, r * 0.3, 0, Math.PI * 2); g.stroke();
  for (let k = 0; k < 8; k++) { const a = rot + (k + 0.5) / 8 * Math.PI * 2; g.beginPath(); g.moveTo(x + Math.cos(a) * r * 0.42, y + Math.sin(a) * r * 0.42); g.lineTo(x + Math.cos(a) * r * 0.7, y + Math.sin(a) * r * 0.7); g.stroke(); }
  g.fillStyle = '#1d2f5b'; g.beginPath(); g.arc(x, y, r * 0.14, 0, Math.PI * 2); g.fill();
}
cv.addEventListener('pointerdown', e => {
  unlock();
  if (J.id !== null) return;
  J.id = e.pointerId; try { cv.setPointerCapture(e.pointerId); } catch (err) { /* nic */ }
  J.ox = e.clientX; J.oy = e.clientY; J.on = true;
  move(e); e.preventDefault();
});
cv.addEventListener('pointermove', e => { if (e.pointerId === J.id) { move(e); e.preventDefault(); } });
const end = e => { if (e.pointerId !== J.id) return; J.id = null; J.on = false; J.x = J.y = 0; sendIn(); draw(); };
cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end); cv.addEventListener('lostpointercapture', end);
function move(e) {
  const R = V.R; let dx = e.clientX - J.ox, dy = e.clientY - J.oy; const d = Math.hypot(dx, dy);
  if (d > R) { J.ox += dx / d * (d - R); J.oy += dy / d * (d - R); dx = e.clientX - J.ox; dy = e.clientY - J.oy; }   // věneček jde za prstem
  J.x = dx / R; J.y = dy / R;
  if (Math.hypot(J.x, J.y) < 0.1) J.x = J.y = 0;
  draw();
  if (performance.now() - ME.sentAt > 45) sendIn();
}
function sendIn() { send({ t: 'in', x: +J.x.toFixed(3), y: +J.y.toFixed(3) }); }
setInterval(() => {                                                 // joystick 20× za s, jinak „jsem tu“ každou sekundu
  if (J.on) sendIn(); else if (performance.now() - ME.sentAt > 1000) send({ t: 'hb' });
}, 50);

// ------------------------------------------------------------ zvuk, vibrace, nezhasínání
function unlock() {
  if (ME.snd) {
    if (!Zvuk.A.ctx) { Zvuk.A.pan = false; Zvuk.init(); if (Zvuk.A.ctx) Zvuk.A.ctx.onstatechange = () => { reportAudio(); render(); }; }
    else Zvuk.resume();
  }
  keepAwake();
  setTimeout(() => { reportAudio(); render(); }, 400);
}
function reportAudio(force) {
  const on = ME.snd && Zvuk.running();
  if (force || on !== ME.audioRep) { ME.audioRep = on; send({ t: 'audio', on }); }
}
setInterval(() => {                                                 // hudba hraje jen z jednoho mobilu (vybere televize)
  const st = ME.st, spk = !!(st && ME.ph === 'game' && st.spk === ME.i && ME.snd);
  if (spk) Zvuk.music(st.m, st.m === 'play' ? st.left : 99);
  else if (ME.spk) Zvuk.musicOff();
  ME.spk = spk;
}, 100);
const BUZZ = { cil: [35], novy: [60, 70, 60], vyhra: [80, 60, 80, 60, 220], ztrata: [260], vlk: [140, 90, 140, 90, 140], klik: [12] };
function buzz(k) { try { if (navigator.vibrate && BUZZ[k]) navigator.vibrate(BUZZ[k]); } catch (e) { /* bez vibrací */ } }
let wake = null;
function keepAwake() {
  try { if (navigator.wakeLock && !wake && document.visibilityState === 'visible') navigator.wakeLock.request('screen').then(l => { wake = l; l.addEventListener('release', () => { wake = null; }); }).catch(() => {}); } catch (e) { /* nepodporováno */ }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || PREVIEW) return;
  keepAwake(); Zvuk.resume();
  if (!(ME.conn && ME.conn.open)) connect();                        // po odemčení mobilu hned znovu připojit
});
document.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('hashchange', () => location.reload());
window.addEventListener('resize', fit);
if (document.fonts) document.fonts.ready.then(() => { layout(); draw(); });

// ------------------------------------------------------------ start (nebo náhled bez televize)
function preview(k) {
  const s = (r, n) => ({ r, ai: 0, sc: n, n, w: 0 });
  const base = { t: 'st', m: 'attract', left: 0, go: 0, team: 0, pen: 0, all: 53, lost: 0, why: '', spk: 0, s: [s(0, 0), s(1, 0), null, s(0, 0)] };

    hra: { m: 'play', left: 84, team: 23, s: [s(0, 7), s(0, 5), null, s(0, 4)] }, ai: { m: 'play', left: 61, team: 23, s: [{ r: 0, ai: 1, sc: 2, n: 2, w: 0 }, s(0, 5), null, s(0, 4)] },

}
fit();
if (PREVIEW) preview(PREVIEW); else connect();
window.pastyr = { me: () => ({ i: ME.i, ph: ME.ph, st: ME.st, audio: Zvuk.running(), nsnd: ME.nsnd || 0, music: ME.spk }), J };
